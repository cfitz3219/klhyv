[package]
name = "tessera-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tessera_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "tessera-app"
path = "src/main.rs"

[features]
default = ["onnx"]
onnx = ["tessera-core/onnx"]
cuda = ["tessera-core/cuda"]
tensorrt = ["tessera-core/tensorrt"]
directml = ["tessera-core/directml"]
coreml = ["tessera-core/coreml"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tessera-core = { path = "../tessera-core", default-features = false }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
anyhow.workspace = true
image.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
